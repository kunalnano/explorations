    <script>
      // Animated favicon — pulsing AI node
      (function() {
        const S = 32, H = S / 2;
        const canvas = document.createElement('canvas');
        canvas.width = S;
        canvas.height = S;
        const ctx = canvas.getContext('2d');
        const link = document.querySelector("link[rel='icon']");
        let t = 0;

        function draw() {
          t += 0.025;
          ctx.clearRect(0, 0, S, S);
          const pulse = Math.sin(t) * 0.3 + 0.7;

          // Outer ring
          ctx.beginPath();
          ctx.arc(H, H, 12, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(201,168,76,' + (0.3 * pulse) + ')';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Glow
          const g = ctx.createRadialGradient(H, H, 0, H, H, 10 + pulse * 3);
          g.addColorStop(0, 'rgba(201,168,76,' + (0.35 * pulse) + ')');
          g.addColorStop(1, 'transparent');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, S, S);

          // Core node
          ctx.beginPath();
          ctx.arc(H, H, 5 + pulse * 1.5, 0, Math.PI * 2);
          const ng = ctx.createRadialGradient(H - 2, H - 2, 0, H, H, 7);
          ng.addColorStop(0, '#e8d48b');
          ng.addColorStop(1, '#8b7a3a');
          ctx.fillStyle = ng;
          ctx.fill();

          link.href = canvas.toDataURL('image/png');
          requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
      })();
    </script>
    <!-- ═══ CONTACT PANEL ═══ opened by the "Get in touch" CTAs via the open-contact event -->
    <div id="contact-backdrop" onclick="toggleContact(false)" style="position:fixed;inset:0;z-index:9998;background:rgba(5,5,8,0.16);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 0.3s;"></div>
    <div id="contact-panel" role="dialog" aria-modal="true" aria-labelledby="contact-title" inert style="position:fixed;top:0;right:0;bottom:0;width:min(430px,calc(100vw - 22px));z-index:9999;background:#fff;border-left:1px solid rgba(5,5,8,0.14);transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);display:flex;flex-direction:column;overflow:hidden;">

      </div>
      <div id="contact-body" style="flex:1;overflow-y:auto;padding:28px;">
        <div style="display:flex;flex-direction:column;gap:20px;">
          <div><label for="cf-name" style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:rgba(5,5,5,0.58);letter-spacing:0.14em;text-transform:uppercase;display:block;margin-bottom:8px;">Name</label><input id="cf-name" autocomplete="name" style="width:100%;padding:13px 14px;font-family:'IBM Plex Sans',sans-serif;font-size:16px;background:#fff;border:1px solid rgba(5,5,8,0.22);border-radius:0;color:#050505;box-sizing:border-box;" /></div>
          <div><label for="cf-email" style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:rgba(5,5,5,0.58);letter-spacing:0.14em;text-transform:uppercase;display:block;margin-bottom:8px;">Email</label><input id="cf-email" type="email" autocomplete="email" style="width:100%;padding:13px 14px;font-family:'IBM Plex Sans',sans-serif;font-size:16px;background:#fff;border:1px solid rgba(5,5,8,0.22);border-radius:0;color:#050505;box-sizing:border-box;" /></div>
          <div><label for="cf-msg" style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:rgba(5,5,5,0.58);letter-spacing:0.14em;text-transform:uppercase;display:block;margin-bottom:8px;">Message</label><textarea id="cf-msg" rows="6" style="width:100%;padding:13px 14px;font-family:'IBM Plex Sans',sans-serif;font-size:16px;background:#fff;border:1px solid rgba(5,5,8,0.22);border-radius:0;color:#050505;box-sizing:border-box;resize:vertical;min-height:120px;"></textarea></div>

          <button id="cf-submit" onclick="submitContact()" style="font-family:'JetBrains Mono',monospace;min-height:48px;padding:0 22px;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;border-radius:0;cursor:pointer;background:#050505;color:#fff;border:1px solid #050505;">Send message</button>
          <p style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(5,5,5,0.58);margin:0;">Or email <a href="mailto:hello@darkvectorcognition.ai" style="color:#050505;">hello@darkvectorcognition.ai</a></p>
        </div>

    <script>
      var contactReturnFocus=null;
      function toggleContact(open){var p=document.getElementById('contact-panel'),b=document.getElementById('contact-backdrop');if(open){contactReturnFocus=document.activeElement;p.inert=false;p.style.transform='translateX(0)';p.style.boxShadow='-28px 0 90px rgba(5,5,8,0.12)';b.style.opacity='1';b.style.pointerEvents='auto';var n=document.getElementById('cf-name');if(n)setTimeout(function(){n.focus();},60);}else{p.inert=true;p.style.transform='translateX(100%)';p.style.boxShadow='none';b.style.opacity='0';b.style.pointerEvents='none';if(contactReturnFocus&&contactReturnFocus.focus)contactReturnFocus.focus();}}
      function contactFail(msg){var btn=document.getElementById('cf-submit'),err=document.getElementById('cf-error');btn.textContent='Send message';btn.style.opacity='1';btn.disabled=false;err.textContent=msg;err.style.display='block';}
      function submitContact(){var n=document.getElementById('cf-name').value.trim(),e=document.getElementById('cf-email').value.trim(),m=document.getElementById('cf-msg').value.trim(),btn=document.getElementById('cf-submit'),err=document.getElementById('cf-error');err.style.display='none';if(!n||!e||!m){contactFail('Name, email and a message are all needed.');return;}if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){contactFail('That email address does not look right.');return;}btn.textContent='Sending\u2026';btn.style.opacity='0.5';btn.disabled=true;fetch('https://formspree.io/f/mykboegz',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name:n,email:e,message:m})}).then(function(r){if(!r.ok)throw new Error();document.getElementById('contact-body').innerHTML='<div style="padding-top:40px;"><p style="font-family:Space Grotesk,sans-serif;font-weight:600;font-size:30px;letter-spacing:-0.04em;color:#050505;margin:0 0 12px;">Message received.</p><p style="font-family:IBM Plex Sans,sans-serif;font-size:17px;line-height:1.6;color:rgba(5,5,5,0.69);margin:0 0 28px;">I will reply within 24 hours.</p><button onclick="toggleContact(false)" style="font-family:JetBrains Mono,monospace;min-height:48px;padding:0 22px;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;border-radius:0;cursor:pointer;background:transparent;color:#050505;border:1px solid rgba(5,5,8,0.22);">Close</button></div>';}).catch(function(){contactFail('That did not send. Email hello@darkvectorcognition.ai instead.');});}
      document.addEventListener('keydown',function(ev){if(ev['key']==='Escape')toggleContact(false);});
      window.addEventListener('open-contact',function(){toggleContact(true);});
    </script>
