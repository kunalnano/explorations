    <div id="root"></div>

    <!-- CONTACT PANEL: opened by the "Get in touch" CTAs via the open-contact event -->
    <div id="contact-backdrop" style="position:fixed;inset:0;z-index:9998;background:rgba(5,5,8,0.16);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 0.3s;"></div>
    <div id="contact-panel" role="dialog" aria-modal="true" aria-labelledby="contact-title" inert style="position:fixed;top:0;right:0;bottom:0;width:min(430px,calc(100vw - 22px));z-index:9999;background:#fff;border-left:1px solid rgba(5,5,8,0.14);transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);display:flex;flex-direction:column;overflow:hidden;">
      <div style="padding:24px 28px 20px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid rgba(5,5,8,0.11);">
        <div>
          <p style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:rgba(5,5,5,0.58);letter-spacing:0.14em;text-transform:uppercase;margin:0;">Replies within 24 hours</p>
          <p id="contact-title" style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;letter-spacing:-0.035em;color:#050505;margin:8px 0 0;">Get in touch.</p>
        </div>
        <button id="contact-close" type="button" aria-label="Close contact form" style="background:none;border:none;color:rgba(5,5,5,0.69);font-size:28px;cursor:pointer;width:44px;height:44px;line-height:1;">&times;</button>
      </div>
      <div id="contact-body" style="flex:1;overflow-y:auto;padding:28px;">
        <div style="display:flex;flex-direction:column;gap:20px;">
          <input id="cf-gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none;" />
          <div><label for="cf-name" style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:rgba(5,5,5,0.58);letter-spacing:0.14em;text-transform:uppercase;display:block;margin-bottom:8px;">Name</label><input id="cf-name" name="name" maxlength="100" autocomplete="name" style="width:100%;padding:13px 14px;font-family:'IBM Plex Sans',sans-serif;font-size:16px;background:#fff;border:1px solid rgba(5,5,8,0.22);border-radius:0;color:#050505;box-sizing:border-box;" /></div>
          <div><label for="cf-email" style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:rgba(5,5,5,0.58);letter-spacing:0.14em;text-transform:uppercase;display:block;margin-bottom:8px;">Email</label><input id="cf-email" name="email" type="email" maxlength="254" autocomplete="email" style="width:100%;padding:13px 14px;font-family:'IBM Plex Sans',sans-serif;font-size:16px;background:#fff;border:1px solid rgba(5,5,8,0.22);border-radius:0;color:#050505;box-sizing:border-box;" /></div>
          <div><label for="cf-msg" style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:rgba(5,5,5,0.58);letter-spacing:0.14em;text-transform:uppercase;display:block;margin-bottom:8px;">Message</label><textarea id="cf-msg" name="message" maxlength="5000" rows="6" style="width:100%;padding:13px 14px;font-family:'IBM Plex Sans',sans-serif;font-size:16px;background:#fff;border:1px solid rgba(5,5,8,0.22);border-radius:0;color:#050505;box-sizing:border-box;resize:vertical;min-height:120px;"></textarea></div>
          <p id="cf-error" role="alert" style="font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5;color:#a01818;margin:0;display:none;"></p>
          <button id="cf-submit" type="button" style="font-family:'JetBrains Mono',monospace;min-height:48px;padding:0 22px;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;border-radius:0;cursor:pointer;background:#050505;color:#fff;border:1px solid #050505;">Send message</button>
          <p style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(5,5,5,0.58);margin:0;">Or email <a href="mailto:hello@darkvectorcognition.ai" style="color:#050505;">hello@darkvectorcognition.ai</a></p>
        </div>
      </div>
