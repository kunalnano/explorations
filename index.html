<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%2300d4ff'/><stop offset='100%25' stop-color='%238b5cf6'/></linearGradient></defs><circle cx='16' cy='16' r='8' fill='url(%23g)'/><circle cx='16' cy='16' r='12' fill='none' stroke='url(%23g)' stroke-width='1' opacity='0.4'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Al Sharma — I build things that think. AI systems, interactive explorations, and the software factory." />
    <meta property="og:title" content="Al Sharma" />
    <meta property="og:description" content="I build things that think. Founder, Dark Vector Cognition." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alsharma.com" />
    <title>Al Sharma</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #08080f; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Animated favicon — pulsing AI node
      (function() {
        const S = 32, H = S / 2;
        const canvas = document.createElement('canvas');
        canvas.width = S;
        canvas.height = S;
        const ctx = canvas.getContext('2d');
        const link = document.querySelector("link[rel='icon']");
        let t = 0;

        function draw() {
          t += 0.025;
          ctx.clearRect(0, 0, S, S);
          const pulse = Math.sin(t) * 0.3 + 0.7;

          // Outer ring
          ctx.beginPath();
          ctx.arc(H, H, 12, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0,212,255,' + (0.25 * pulse) + ')';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Glow
          const g = ctx.createRadialGradient(H, H, 0, H, H, 10 + pulse * 3);
          g.addColorStop(0, 'rgba(0,212,255,' + (0.35 * pulse) + ')');
          g.addColorStop(1, 'transparent');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, S, S);

          // Core node
          ctx.beginPath();
          ctx.arc(H, H, 5 + pulse * 1.5, 0, Math.PI * 2);
          const ng = ctx.createRadialGradient(H - 2, H - 2, 0, H, H, 7);
          ng.addColorStop(0, '#00d4ff');
          ng.addColorStop(1, '#8b5cf6');
          ctx.fillStyle = ng;
          ctx.fill();

          link.href = canvas.toDataURL('image/png');
          requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
      })();
    </script>
  </body>
</html>
