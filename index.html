<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Al Sharma — builder of AI systems, post-sales organizations, and interactive explorations." />
    <meta property="og:title" content="Al Sharma" />
    <meta property="og:description" content="I build things that think. Founder, Dark Vector Cognition." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alsharma.com" />
    <title>Al Sharma</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #050508; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Animated favicon — cycling gold diamond
      (function() {
        const SIZE = 32;
        const canvas = document.createElement('canvas');
        canvas.width = SIZE;
        canvas.height = SIZE;
        const ctx = canvas.getContext('2d');
        const link = document.querySelector("link[rel='icon']");
        let t = 0;

        function drawFavicon() {
          t += 0.03;
          ctx.clearRect(0, 0, SIZE, SIZE);

          // Pulsing glow
          const pulse = Math.sin(t) * 0.3 + 0.7;
          const glowR = 10 + pulse * 4;
          const grad = ctx.createRadialGradient(SIZE/2, SIZE/2, 0, SIZE/2, SIZE/2, glowR);
          grad.addColorStop(0, 'rgba(201,168,76,' + (0.4 * pulse) + ')');
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, SIZE, SIZE);

          // Diamond shape
          ctx.save();
          ctx.translate(SIZE/2, SIZE/2);
          ctx.rotate(t * 0.5);
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.lineTo(8, 0);
          ctx.lineTo(0, 10);
          ctx.lineTo(-8, 0);
          ctx.closePath();

          const dGrad = ctx.createLinearGradient(-8, -10, 8, 10);
          dGrad.addColorStop(0, '#e8d48b');
          dGrad.addColorStop(0.5, '#c9a84c');
          dGrad.addColorStop(1, '#8b7a3a');
          ctx.fillStyle = dGrad;
          ctx.fill();
          ctx.restore();

          link.href = canvas.toDataURL('image/png');
          requestAnimationFrame(drawFavicon);
        }
        requestAnimationFrame(drawFavicon);
      })();

    </script>
  </body>
</html>
