  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- CONTACT PANEL: opened by the "Get in touch" CTAs via the open-contact event -->
    <div id="contact-backdrop" class="contact-backdrop"></div>
    <div id="contact-panel" class="contact-panel apple-shell" role="dialog" aria-modal="true" aria-labelledby="contact-title" inert>
      <div class="contact-header">
        <div>
          <p class="contact-eyebrow">Replies within 24 hours</p>
          <p id="contact-title" class="contact-title">Get in touch.</p>
        </div>
        <button id="contact-close" class="contact-close" type="button" aria-label="Close contact form">&times;</button>
      </div>
      <div id="contact-body" class="contact-body">
        <div class="contact-form">
          <input id="cf-gotcha" class="contact-gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <div>
            <label for="cf-name" class="contact-label">Name</label>
            <input id="cf-name" class="contact-input apple-control" name="name" maxlength="100" autocomplete="name" />
          </div>
          <div>
            <label for="cf-email" class="contact-label">Email</label>
            <input id="cf-email" class="contact-input apple-control" name="email" type="email" maxlength="254" autocomplete="email" />
          </div>
          <div>
            <label for="cf-msg" class="contact-label">Message</label>
            <textarea id="cf-msg" class="contact-input contact-textarea apple-control" name="message" maxlength="5000" rows="6"></textarea>
          </div>
          <p id="cf-error" class="contact-error" role="alert"></p>
          <button id="cf-submit" class="contact-submit apple-btn-primary apple-pill" type="button">Send message</button>
          <p class="contact-alt">Or email <a href="mailto:hello@darkvectorcognition.ai" class="contact-mailto">hello@darkvectorcognition.ai</a></p>
        </div>
      </div>
    </div>
