<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 - Page Not Found | Al Sharma</title>
    <style>
      @font-face { font-family: "IBM Plex Sans"; src: url("/fonts/ibm-plex-sans-400.ttf"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "IBM Plex Sans"; src: url("/fonts/ibm-plex-sans-500.ttf"); font-weight: 500; font-display: swap; }
      :root {
        --sq-mult: 1;
        --sq-shape: round;
        --radius-xs: 10px;
        --radius-xl: 32px;
        --radius-pill: 980px;
      }
      @supports (corner-shape: superellipse(1.36)) {
        :root {
          --sq-mult: 1.23;
          --sq-shape: superellipse(1.36);
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #f5f5f7; color: #1d1d1f; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 540px;
        width: 100%;
        background: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
        border-radius: calc(var(--radius-xl) * var(--sq-mult));
        corner-shape: var(--sq-shape);
        padding: clamp(28px, 5vw, 44px);
      }
      .eyebrow {
        display: inline-block;
        padding: 5px 12px;
        background: #f5f5f7;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: calc(var(--radius-xs) * var(--sq-mult));
        corner-shape: var(--sq-shape);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6e6e73;
      }
      h1 {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "IBM Plex Sans", sans-serif;
        font-size: clamp(34px, 6vw, 52px);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.06;
        margin: 18px 0 14px;
        color: #1d1d1f;
      }
      p {
        font-size: 17px;
        line-height: 1.55;
        color: #515154;
        margin-bottom: 28px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.01em;
        text-decoration: none;
        background: #0071e3;
        color: #ffffff;
        border: 1px solid transparent;
        border-radius: var(--radius-pill);
        transition: background-color 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      a:hover { background: #0077ed; }
      a:focus-visible { outline: 3px solid #0066cc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">HTTP 404</div>
      <h1>Page not found.</h1>
      <p>That address does not exist on alsharma.com.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
