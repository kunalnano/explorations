<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 - Page Not Found | Al Sharma</title>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("/fonts/space-grotesk-600.ttf"); font-weight: 600; font-display: swap; }
      @font-face { font-family: "IBM Plex Sans"; src: url("/fonts/ibm-plex-sans-400.ttf"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "JetBrains Mono"; src: url("/fonts/jetbrains-mono-500.ttf"); font-weight: 500; font-display: swap; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #ffffff; color: #050505; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 520px; width: 100%; border-top: 1px solid rgba(5, 5, 8, 0.14); padding-top: 28px; }
      .eyebrow {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(5, 5, 5, 0.58);
      }
      h1 {
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: clamp(36px, 6vw, 56px);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.04;
        margin: 14px 0 16px;
      }
      p {
        font-size: 17px;
        line-height: 1.6;
        color: rgba(5, 5, 5, 0.69);
        margin-bottom: 28px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        background: #050505;
        color: #ffffff;
        border: 1px solid #050505;
      }
      a:focus-visible { outline: 2px solid #050505; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">HTTP 404</div>
      <h1>Page not found.</h1>
      <p>That address does not exist on alsharma.com.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
