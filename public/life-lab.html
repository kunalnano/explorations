<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMERGENT LIFE LAB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --panel: #0d0d14;
    --border: #1a1a2e;
    --glow-cyan: #00ffd5;
    --glow-magenta: #ff00aa;
    --glow-amber: #ffaa00;
    --text: #88889a;
    --text-bright: #c0c0d0;
    --scanline: rgba(0, 255, 213, 0.03);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* CRT scanline overlay */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      var(--scanline) 2px,
      var(--scanline) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }

  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--glow-cyan), var(--glow-magenta));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(0, 255, 213, 0.3);
  }

  .header-stats {
    display: flex;
    gap: 20px;
    font-size: 11px;
  }

  .stat { color: var(--text); }
  .stat span { color: var(--glow-cyan); font-weight: bold; }

  .main-area {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--bg);
  }

  canvas {
    image-rendering: pixelated;
    cursor: crosshair;
  }

  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: var(--bg); }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .panel {
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .panel-header {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 6px 10px;
    background: rgba(0, 255, 213, 0.05);
    border-bottom: 1px solid var(--border);
    color: var(--glow-cyan);
  }

  .panel-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .control-row label {
    font-size: 10px;
    color: var(--text);
    white-space: nowrap;
  }

  .control-row .val {
    font-size: 10px;
    color: var(--glow-cyan);
    min-width: 30px;
    text-align: right;
  }

  input[type="range"] {
    -webkit-appearance: none;
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--glow-cyan);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0, 255, 213, 0.5);
  }

  .btn-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    flex: 1;
    text-align: center;
  }

  .btn:hover {
    border-color: var(--glow-cyan);
    color: var(--glow-cyan);
    box-shadow: 0 0 10px rgba(0, 255, 213, 0.15);
  }

  .btn.active {
    border-color: var(--glow-cyan);
    background: rgba(0, 255, 213, 0.1);
    color: var(--glow-cyan);
  }

  .btn.danger:hover {
    border-color: var(--glow-magenta);
    color: var(--glow-magenta);
    box-shadow: 0 0 10px rgba(255, 0, 170, 0.15);
  }

  .btn.warn {
    border-color: var(--glow-amber);
    color: var(--glow-amber);
  }

  select {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    background: var(--bg);
    color: var(--text-bright);
    border: 1px solid var(--border);
    padding: 4px 6px;
    border-radius: 2px;
    outline: none;
    width: 100%;
    cursor: pointer;
  }

  select:focus { border-color: var(--glow-cyan); }

  .sound-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 10px;
  }

  .sound-toggle .indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
    transition: all 0.3s;
  }

  .sound-toggle .indicator.on {
    background: var(--glow-cyan);
    box-shadow: 0 0 10px rgba(0, 255, 213, 0.5);
  }

  .vis-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 2px;
  }

  .vis-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--glow-cyan), var(--glow-magenta));
    transition: width 0.1s;
    border-radius: 2px;
  }

  .pattern-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  .footer {
    padding: 4px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    font-size: 9px;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .footer span { color: var(--glow-cyan); }
</style>
</head>
<body>
<div class="header">
  <h1>EMERGENT LIFE LAB</h1>
  <div class="header-stats">
    <div class="stat">GEN <span id="gen-count">0</span></div>
    <div class="stat">POP <span id="pop-count">0</span></div>
    <div class="stat">DENSITY <span id="density">0%</span></div>
    <div class="stat">FPS <span id="fps-display">0</span></div>
  </div>
</div>

<div class="main-area">
  <div class="canvas-wrap">
    <canvas id="life-canvas"></canvas>
  </div>

  <div class="sidebar">
    <!-- TRANSPORT -->
    <div class="panel">
      <div class="panel-header">TRANSPORT</div>
      <div class="panel-body">
        <div class="btn-row">
          <button class="btn active" id="btn-play" type="button">▶ PLAY</button>
          <button class="btn" id="btn-step" type="button">⏭ STEP</button>
          <button class="btn danger" id="btn-clear" type="button">✕ CLEAR</button>
        </div>
        <div class="control-row">
          <label for="speed">SPEED</label>
          <input type="range" id="speed" min="1" max="60" value="15">
          <span class="val" id="speed-val">15</span>
        </div>
      </div>
    </div>

    <!-- RULES -->
    <div class="panel">
      <div class="panel-header">RULE ENGINE</div>
      <div class="panel-body">
        <select id="ruleset">
          <option value="conway">Conway (B3/S23)</option>
          <option value="highlife">HighLife (B36/S23)</option>
          <option value="daynight">Day &amp; Night (B3678/S34678)</option>
          <option value="seeds">Seeds (B2/S)</option>
          <option value="replicator">Replicator (B1357/S1357)</option>
          <option value="diamoeba">Diamoeba (B35678/S5678)</option>
          <option value="anneal">Anneal (B4678/S35678)</option>
          <option value="morley">Morley (B368/S245)</option>
        </select>
        <div class="control-row" style="margin-top:4px">
          <label for="mutation">MUTATION</label>
          <input type="range" id="mutation" min="0" max="50" value="0">
          <span class="val" id="mutation-val">0%</span>
        </div>
      </div>
    </div>

    <!-- VISUAL MODE -->
    <div class="panel">
      <div class="panel-header">VISUAL MODE</div>
      <div class="panel-body">
        <div class="btn-row">
          <button class="btn active" data-vis="neon" type="button">NEON</button>
          <button class="btn" data-vis="heat" type="button">HEAT</button>
          <button class="btn" data-vis="psyche" type="button">PSYCHE</button>
        </div>
        <div class="btn-row">
          <button class="btn" data-vis="ghost" type="button">GHOST</button>
          <button class="btn" data-vis="matrix" type="button">MATRIX</button>
          <button class="btn" data-vis="plasma" type="button">PLASMA</button>
        </div>
        <div class="control-row">
          <label for="trail">TRAIL</label>
          <input type="range" id="trail" min="0" max="100" value="30">
          <span class="val" id="trail-val">30</span>
        </div>
        <div class="control-row">
          <label for="glow">GLOW</label>
          <input type="range" id="glow" min="0" max="100" value="60">
          <span class="val" id="glow-val">60</span>
        </div>
      </div>
    </div>

    <!-- BRUSH -->
    <div class="panel">
      <div class="panel-header">BRUSH</div>
      <div class="panel-body">
        <div class="control-row">
          <label for="brush-size">SIZE</label>
          <input type="range" id="brush-size" min="1" max="10" value="2">
          <span class="val" id="brush-val">2</span>
        </div>
        <div class="btn-row">
          <button class="btn active" data-brush="draw" type="button">DRAW</button>
          <button class="btn" data-brush="erase" type="button">ERASE</button>
        </div>
      </div>
    </div>

    <!-- PATTERNS -->
    <div class="panel">
      <div class="panel-header">SEED PATTERNS</div>
      <div class="panel-body">
        <div class="pattern-grid">
          <button class="btn" data-pattern="random" type="button">RANDOM</button>
          <button class="btn" data-pattern="soup" type="button">SOUP</button>
          <button class="btn" data-pattern="gliders" type="button">GLIDERS</button>
          <button class="btn" data-pattern="pulsars" type="button">PULSARS</button>
          <button class="btn" data-pattern="gosper" type="button">GOSPER</button>
          <button class="btn" data-pattern="acorn" type="button">ACORN</button>
          <button class="btn" data-pattern="rpent" type="button">R-PENT</button>
          <button class="btn" data-pattern="diehard" type="button">DIEHARD</button>
          <button class="btn" data-pattern="noise" type="button">NOISE</button>
        </div>
      </div>
    </div>

    <!-- SOUND -->
    <div class="panel">
      <div class="panel-header">SONIFICATION</div>
      <div class="panel-body">
        <div class="sound-toggle" id="sound-toggle">
          <div class="indicator" id="sound-indicator"></div>
          <span id="sound-label">SOUND OFF - click to enable</span>
        </div>
        <div class="control-row">
          <label for="volume">VOLUME</label>
          <input type="range" id="volume" min="0" max="100" value="40">
          <span class="val" id="volume-val">40</span>
        </div>
        <select id="sound-mode">
          <option value="harmonic">Harmonic Density</option>
          <option value="percussion">Percussive Grid</option>
          <option value="ambient">Ambient Wash</option>
          <option value="glitch">Glitch Scan</option>
        </select>
        <div class="vis-bar"><div class="vis-bar-fill" id="audio-vis" style="width:0%"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <div>CLICK/DRAG to draw · <span>SPACE</span> play/pause · <span>R</span> random · <span>C</span> clear · <span>S</span> sound</div>
  <div>CELL SIZE: <span id="cell-info">4px</span> · GRID: <span id="grid-info">0×0</span></div>
</div>

<script defer src="/life-lab.js"></script>
</body>
</html>
